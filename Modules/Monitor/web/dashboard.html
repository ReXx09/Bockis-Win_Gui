<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bockis System-Tool - Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #388bfd;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.title { font-size: 20px; font-weight: 600; }
.sub { font-size: 12px; color: var(--muted); }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.subnav-btn {
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
.subnav-btn:hover { color: var(--text); border-color: var(--blue); }
.subnav-btn.active {
  color: #c8e1ff;
  border-color: rgba(56, 139, 253, 0.75);
  background: rgba(56, 139, 253, 0.16);
}
.grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 0;
}
.span-12 { grid-column: span 12; }
.span-8 { grid-column: span 8; }
.span-4 { grid-column: span 4; }
@media (max-width: 980px) {
  .span-8, .span-4, .span-12 { grid-column: span 12; }
}
.card-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.card-title {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .07em;
  font-weight: 700;
}
.btn {
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.btn:hover { background: var(--border); }
.ck { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
#live {
  height: 360px;
  overflow-y: auto;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: Consolas, monospace;
  font-size: 12px;
  line-height: 1.55;
}
#log-list { max-height: 360px; overflow-y: auto; }
.litem {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  background: var(--surface2);
}
.litem:hover { border-color: var(--blue); }
.litem.sel { border-color: var(--blue); box-shadow: inset 0 0 0 1px rgba(56, 139, 253, 0.25); }
.litem .n { font-size: 12px; word-break: break-all; }
.litem .m { font-size: 11px; color: var(--muted); margin-top: 4px; }
#logv {
  height: 360px;
  overflow-y: auto;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-family: Consolas, monospace;
  font-size: 12px;
  line-height: 1.55;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  padding: 8px 0;
}
.row:last-child { border-bottom: 0; }
.row-label { color: var(--muted); font-size: 12px; }
.row-value { font-family: Consolas, monospace; font-size: 12px; }
.input {
  border: 1px solid var(--border);
  background: #0f141b;
  color: var(--text);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
  font-size: 12px;
}
.actions { display: flex; gap: 8px; margin-top: 10px; }
.mono {
  font-family: Consolas, monospace;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  margin-top: 8px;
  font-size: 12px;
  max-height: 140px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 8px;
}
.b-green { color: var(--green); background: rgba(63, 185, 80, 0.15); }
.b-red { color: var(--red); background: rgba(248, 81, 73, 0.15); }
.pane-hidden { display: none !important; }
.ln { white-space: pre-wrap; word-break: break-word; padding: 1px 0; }
.ln.Information, .ln.INFO { color: #79c0ff; }
.ln.Success, .ln.SUCCESS { color: var(--green); }
.ln.Warning, .ln.WARNING { color: var(--yellow); }
.ln.Error, .ln.ERROR { color: var(--red); }
.ln.plain { color: var(--muted); }
.ts { color: #6e7681; margin-right: 6px; }
.tb {
  display: inline-block;
  padding: 1px 6px;
  margin-right: 6px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted);
  font-size: 11px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.empty { color: var(--muted); font-style: italic; padding: 14px; }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">Bockis System-Tool Dashboard</div>
      <div class="sub" id="headerSub">Live-Ausgabe und Logs</div>
    </div>
    <div class="subnav">
      <button class="subnav-btn active" data-pane-btn="overview" onclick="setActivePane('overview')">Uebersicht</button>
      <button class="subnav-btn" data-pane-btn="logs" onclick="setActivePane('logs')">Logs</button>
    </div>
  </div>

  <div class="grid">
    <div class="card span-8" data-pane="overview">
      <div class="card-h">
        <div class="card-title">Live-Ausgabe</div>
        <div>
          <button class="btn" onclick="clearLive()">Leeren</button>
          <label class="ck"><input type="checkbox" id="asc" checked>Auto-Scroll</label>
        </div>
      </div>
      <div id="live"><div class="empty" id="livempty">Warte auf Ausgaben...</div></div>
    </div>

    <div class="card span-4" data-pane="overview">
      <div class="card-h"><div class="card-title">Status</div></div>
      <div class="row"><span class="row-label">Dashboard</span><span class="row-value" id="runBadge"><span class="badge b-red">OFFLINE</span></span></div>
      <div class="row"><span class="row-label">Host</span><span class="row-value" id="hostInfo"></span></div>
      <div class="row"><span class="row-label">Port</span><span class="row-value" id="portInfo">-</span></div>
      <div class="row"><span class="row-label">Aktive Log-Datei</span><span class="row-value" id="activeLogLabel">-</span></div>
    </div>

    <div class="card span-4" data-pane="overview">
      <div class="card-h"><div class="card-title">Git Pull</div></div>
      <div class="row"><span class="row-label">Branch</span><span class="row-value" id="gitBranch">-</span></div>
      <div class="row"><span class="row-label">Upstream</span><span class="row-value" id="gitUpstream">-</span></div>
      <div class="row"><span class="row-label">Ahead / Behind</span><span class="row-value" id="gitAheadBehind">-</span></div>
      <div class="row"><span class="row-label">Lokale Änderungen</span><span class="row-value" id="gitDirty">-</span></div>
      <div style="margin-top:10px;">
        <div class="row-label" style="margin-bottom:4px;">Remote</div>
        <input class="input" id="gitRemote" value="origin" />
      </div>
      <div style="margin-top:8px;">
        <div class="row-label" style="margin-bottom:4px;">Ziel-Branch</div>
        <input class="input" id="gitTargetBranch" value="main" />
      </div>
      <div class="actions">
        <button class="btn" onclick="refreshGitStatus()">Git Status</button>
        <button class="btn" onclick="pullGitNow()">Git Pull</button>
        <button class="btn" id="restartBtn" style="display:none;background:#5c3000;" onclick="restartApp()">&#x21BA; Neu starten</button>
      </div>
      <div id="gitMsg" class="mono">Warte auf Git-Status...</div>
    </div>

    <div class="card span-12" data-pane="logs">
      <div class="card-h">
        <div class="card-title">Log-Dateien</div>
        <button class="btn" onclick="reloadLog()">Aktualisieren</button>
      </div>
      <div class="grid" style="grid-template-columns: 320px minmax(0,1fr); gap: 12px;">
        <div id="log-list"><div class="empty">Lade...</div></div>
        <div id="logv"><div class="empty">Log-Datei links auswaehlen</div></div>
      </div>
    </div>
  </div>

<script src="/assets/dashboard.js"></script>
</body>
</html>
